services:
  bot:
    build:
      dockerfile: ./Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: prod
    depends_on:
      - db
    networks:
      - default
      - shared
    command: ["uv", "run", "src/main.py"]

  db:
    image: docker.io/library/postgres:17
    env_file:
      - src/settings/.env
    volumes:
      - teha_bot:/var/lib/postgresql/data

volumes:
  teha_bot:


networks:
  shared:
    external: true
    name: poly-shared
