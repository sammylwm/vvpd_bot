services:
  bot:
    build:
      dockerfile: ./Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: prod
    depends_on:
      - db
    command: ["uv", "run", "src/main.py"]

  db:
    image: docker.io/library/postgres:17
    env_file:
      - app/settings/.env
    volumes:
      - ivt_bot:/var/lib/postgresql/data

volumes:
  ivt_bot:
