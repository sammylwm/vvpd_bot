services:
  bot:
    build:
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - src/settings/.env
    environment:
      POSTGRES_HOST: db
    networks:
      - default
      - shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    env_file:
      - src/settings/.env
    volumes:
      - polytech_plan:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polytech_plan:


networks:
  shared:
    external: true
    name: poly-shared
